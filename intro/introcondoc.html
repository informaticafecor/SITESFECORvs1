<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficio Circular - Revista FECOR</title>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Fondo */
        .pdf-container-main {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background-color: #0F2C52;
            background-image: 
                linear-gradient(rgba(15, 44, 82, 0.6), rgba(15, 44, 82, 0.6)),
                url('https://raw.githubusercontent.com/informaticafecor/SITESFECORvs1/refs/heads/main/intro/fondo.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-top: 50px;
            position: relative;
        }

        .pdf-wrapper {
            position: relative;
            width: 91.666667%;
            max-width: 1200px;
            height: 75%;
            background-color: #FFD040;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        .pdf-content {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 4px;
        }

        .pdf-display {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .pdf-slide {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            touch-action: auto;
        }

        .pdf-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            border-radius: 8px;
            background: #f8f9fa;
            position: relative;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        .pdf-pages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            min-height: 100%;
            width: 100%;
            box-sizing: border-box;
        }

        /* Canvas para PDF.js */
        .pdf-canvas {
            max-width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        /* Overlays para enlaces clickeables */
        .pdf-link-overlay {
            position: absolute;
            cursor: pointer;
            background-color: transparent;
            border: none;
            border-radius: 4px;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .pdf-link-overlay:hover {
            background-color: transparent;
            border: none;
        }

        .pdf-link-overlay::after {
            content: '🔗 Click para abrir';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .pdf-link-overlay:hover::after {
            opacity: 1;
        }

        /* Titulo del documento */
        .document-title {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 15;
            opacity: 1;
        }

        /* Decoraciones de esquinas */
        .corner-decoration {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 4px solid #D97706;
            z-index: 10;
        }

        .corner-decoration.top-left {
            top: 8px;
            left: 8px;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 12px;
        }

        .corner-decoration.top-right {
            top: 8px;
            right: 8px;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 12px;
        }

        .corner-decoration.bottom-left {
            bottom: 8px;
            left: 8px;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 12px;
        }

        .corner-decoration.bottom-right {
            bottom: 8px;
            right: 8px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 12px;
        }

        /* Media queries */
        @media (max-width: 768px) {
            .pdf-container-main {
                padding-top: 20px;
            }
            
            .pdf-wrapper {
                width: 95%;
                height: 65%;
            }

            .pdf-container {
                touch-action: pan-y !important;
                -webkit-overflow-scrolling: touch !important;
                overflow: auto !important;
            }
        }

        @media (max-width: 480px) {
            .pdf-container-main {
                padding-top: 15px;
            }
            
            .pdf-wrapper {
                width: 98%;
                height: 60%;
            }
        }

        /* Indicador de carga */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            z-index: 5;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FFD040;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="pdf-container-main">
        <div class="pdf-wrapper">
            <div class="pdf-content">
                <div class="pdf-display">
                    <div class="pdf-slide">
                        <!-- Indicador de carga -->
                        <div class="loading-indicator" id="loadingIndicator">
                            <div class="loading-spinner"></div>
                            <p>Cargando documento...</p>
                        </div>
                        
                        <div class="pdf-container">
                            <div class="pdf-pages-container" id="pdfPagesContainer">
                                <!-- Las páginas del PDF se insertarán aquí dinámicamente -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Titulo del documento -->
                <div class="document-title">Oficio Circular - Revista FECOR</div>
            </div>

            <!-- Decoraciones de esquinas -->
            <div class="corner-decoration top-left"></div>
            <div class="corner-decoration top-right"></div>
            <div class="corner-decoration bottom-left"></div>
            <div class="corner-decoration bottom-right"></div>
        </div>
    </div>

    <script>
        // Variables para PDF
        let pdfDoc = null;
        let totalPages = 0;

        // Configurar PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // === FUNCIONES PARA PDF ===
        async function loadPDF() {
            const pdfUrl = 'https://raw.githubusercontent.com/informaticafecor/SITESFECORvs1/main/intro/documentos/oficio-fecor.pdf';
            
            try {
                console.log('🔄 Cargando PDF...');
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                
                console.log('✅ PDF cargado:', totalPages, 'páginas');
                await renderAllPages();
                
                // Ocultar indicador de carga
                document.getElementById('loadingIndicator').style.display = 'none';
                
            } catch (error) {
                console.error('❌ Error cargando PDF:', error);
                // Mostrar mensaje de error
                const loadingIndicator = document.getElementById('loadingIndicator');
                loadingIndicator.innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <h3>Error al cargar el PDF</h3>
                        <p>No se pudo cargar el documento.</p>
                        <a href="${pdfUrl}" target="_blank" style="color: #0066cc; text-decoration: underline;">Ver PDF en nueva ventana</a>
                    </div>
                `;
            }
        }

        async function renderAllPages() {
            if (!pdfDoc) return;

            const pdfContainer = document.getElementById('pdfPagesContainer');
            pdfContainer.innerHTML = ''; // Limpiar contenido previo

            try {
                // Obtener todas las páginas para calcular el tamaño total
                const pages = [];
                const viewports = [];
                let totalHeight = 0;
                let maxWidth = 0;

                // Primero obtenemos todas las páginas y sus dimensiones
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.5 });
                    pages.push(page);
                    viewports.push(viewport);
                    totalHeight += viewport.height;
                    maxWidth = Math.max(maxWidth, viewport.width);
                }

                // Crear un solo canvas que contenga todas las páginas
                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-canvas';
                canvas.width = maxWidth;
                canvas.height = totalHeight;
                
                const ctx = canvas.getContext('2d');
                
                // Renderizar todas las páginas en el canvas único
                let currentY = 0;
                
                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    const viewport = viewports[i];
                    
                    // Crear un canvas temporal para esta página
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = viewport.width;
                    tempCanvas.height = viewport.height;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    // Renderizar la página en el canvas temporal
                    const renderContext = {
                        canvasContext: tempCtx,
                        viewport: viewport
                    };
                    
                    await page.render(renderContext).promise;
                    
                    // Copiar el canvas temporal al canvas principal
                    ctx.drawImage(tempCanvas, 0, currentY);
                    
                    // Crear overlays para enlaces en esta página
                    await createLinkOverlays(page, viewport, canvas, i + 1, currentY);
                    
                    currentY += viewport.height;
                    
                    console.log(`📄 Página ${i + 1} añadida al documento continuo`);
                }
                
                // Añadir el canvas único al contenedor
                pdfContainer.appendChild(canvas);
                
                console.log('✅ Documento PDF continuo creado exitosamente');
                
            } catch (error) {
                console.error('❌ Error renderizando documento continuo:', error);
            }
        }

        async function createLinkOverlays(page, viewport, canvas, pageNum, offsetY) {
            try {
                // Obtener anotaciones (incluyendo enlaces)
                const annotations = await page.getAnnotations();
                console.log(`🔗 Anotaciones en página ${pageNum}:`, annotations.length);

                const pdfContainer = document.querySelector('.pdf-container');

                annotations.forEach((annotation, index) => {
                    if (annotation.subtype === 'Link' && annotation.url) {
                        console.log(`📎 Enlace encontrado en página ${pageNum}:`, annotation.url);

                        // Convertir coordenadas del PDF a coordenadas del canvas
                        const rect = annotation.rect;
                        const [x1, y1, x2, y2] = rect;

                        // Transformar coordenadas del viewport
                        const canvasX1 = x1 * viewport.scale;
                        const canvasY1 = offsetY + (viewport.height - (y2 * viewport.scale)); // PDF usa coordenadas invertidas + offset de página
                        const canvasX2 = x2 * viewport.scale;
                        const canvasY2 = offsetY + (viewport.height - (y1 * viewport.scale));

                        // Obtener posición del canvas en el contenedor
                        const offsetX = canvas.offsetLeft;
                        const canvasOffsetY = canvas.offsetTop;

                        // Crear overlay clickeable
                        const overlay = document.createElement('div');
                        overlay.className = 'pdf-link-overlay';
                        overlay.style.left = (offsetX + canvasX1) + 'px';
                        overlay.style.top = (canvasOffsetY + canvasY1) + 'px';
                        overlay.style.width = (canvasX2 - canvasX1) + 'px';
                        overlay.style.height = (canvasY2 - canvasY1) + 'px';

                        // Añadir evento click
                        overlay.addEventListener('click', function(e) {
                            e.preventDefault();
                            console.log('🖱️ Click en enlace:', annotation.url);
                            window.open(annotation.url, '_blank');
                        });

                        // Añadir overlay al contenedor del PDF
                        pdfContainer.appendChild(overlay);
                    }
                });

                // Si estamos en la página 2 y no encontramos enlaces automáticamente, crear uno manual
                if (pageNum === 2 && (annotations.length === 0 || !annotations.some(a => a.subtype === 'Link'))) {
                    console.log('🔧 No se encontraron enlaces automáticamente en página 2, creando overlay manual...');
                    createManualLinkOverlay(canvas, pageNum, offsetY);
                }

            } catch (error) {
                console.error('❌ Error creando overlays de enlaces:', error);
                // Fallback: crear overlay manual para página 2
                if (pageNum === 2) {
                    createManualLinkOverlay(canvas, pageNum, offsetY);
                }
            }
        }

        function createManualLinkOverlay(canvas, pageNum, offsetY) {
            // Crear overlay manual para el enlace del Google Forms en la página 2
            if (pageNum === 2) {
                const pdfContainer = document.querySelector('.pdf-container');

                const overlay = document.createElement('div');
                overlay.className = 'pdf-link-overlay';
                
                // Coordenadas aproximadas del enlace en la página 2
                const offsetX = canvas.offsetLeft;
                const canvasOffsetY = canvas.offsetTop;
                
                // COORDENADAS AJUSTADAS basándome en el PDF real
                // El enlace del Google Forms está aproximadamente en:
                // - Horizontal: desde el margen izquierdo hasta casi el derecho
                // - Vertical: en la parte media-baja de la página 2
                
                const linkX = offsetX + (canvas.width * 0.12); // 12% desde la izquierda (margen del texto)
                const linkY = canvasOffsetY + offsetY + (canvas.height * 0.55); // 55% desde arriba de la página 2
                const linkWidth = canvas.width * 0.76; // 76% del ancho (cubre todo el enlace)
                const linkHeight = 50; // Altura generosa para cubrir ambas líneas

                overlay.style.left = linkX + 'px';
                overlay.style.top = linkY + 'px';
                overlay.style.width = linkWidth + 'px';
                overlay.style.height = linkHeight + 'px';

                // URL del Google Forms
                const formsUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfjMTUUwutzQ7W_WCb4L_vddE3N3fK2Rs9woZ5_E6QJGqNXAw/viewform';

                overlay.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('🖱️ Click en enlace manual del Google Forms');
                    window.open(formsUrl, '_blank');
                });

                // TEMPORAL: Hacer visible el overlay para verificar posición
                overlay.style.border = '2px solid red';
                overlay.style.backgroundColor = 'rgba(255, 0, 0, 0.2)';
                overlay.style.opacity = '0.7';

                pdfContainer.appendChild(overlay);
                console.log('✅ Overlay manual creado para Google Forms (VISIBLE para verificación)');
                console.log('📍 Coordenadas:', {
                    x: linkX,
                    y: linkY,
                    width: linkWidth,
                    height: linkHeight,
                    porcentajes: {
                        x: '12%',
                        y: '55%',
                        width: '76%',
                        height: '50px'
                    }
                });
            }
        }

        // === INICIALIZACIÓN ===
        console.log('🚀 Visor PDF único cargado');
        console.log('📄 Documento: Oficio Circular - Revista FECOR');
        console.log('');
        console.log('✅ Características:');
        console.log('   📜 PDF continuo (ambas páginas)');
        console.log('   🖱️ Enlace clickeable del Google Forms');
        console.log('   📱 Scroll libre en móvil y desktop');
        console.log('   🎨 Diseño original mantenido');
        console.log('   🚫 Sin carrusel, sin complicaciones');

        // Cargar PDF automáticamente
        loadPDF();

        // Forzar scroll habilitado después de cargar
        setTimeout(() => {
            const pdfContainer = document.querySelector('.pdf-container');
            if (pdfContainer) {
                pdfContainer.style.overflow = 'auto';
                pdfContainer.style.overflowY = 'auto';
                pdfContainer.style.touchAction = 'pan-y';
                pdfContainer.style.webkitOverflowScrolling = 'touch';
                console.log('✅ Scroll forzado habilitado');
            }
        }, 2000);
    </script>
</body>
</html>
